# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
services:
  - type: web
    name: concord-arpitkjaiswal
    runtime: static
    repo: https://github.com/arpitkjaiswal/Concord
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: '24'
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
